name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add native plugin
        run: |
          DEST=android/app/src/main/java/com/tally/sheet
          mkdir -p "$DEST"
          cp native/*.java "$DEST/"
          sed -i '/^dependencies {/a\    implementation "com.squareup.okhttp3:okhttp:4.12.0"' android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tally-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
