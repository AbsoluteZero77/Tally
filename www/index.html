<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tally</title>
<style>
:root{--bg:#fff;--tx:#222;--mut:#777;--line:#ddd;--hd:#f1f1f1;--hi:#222}
body.dark{--bg:#0b0b0f;--tx:#e8e8ee;--mut:#8b8b99;--line:#25252f;--hd:#16161d;--hi:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.25 Arial,Helvetica,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#top{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--hd);border-bottom:1px solid var(--line)}
#ttl{font-weight:700}
#meta{color:var(--mut);font-size:11px}
table{width:100%;border-collapse:collapse}
th{background:var(--hd);color:var(--mut);font-weight:600;font-size:10px;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line)}
td{padding:5px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td:first-child{width:24px;color:var(--mut)}
td.drv{font-weight:700}
td.best{font-weight:700;color:var(--hi)}
#msg{padding:6px 8px;color:var(--mut);font-size:11px;border-bottom:1px solid var(--line);min-height:26px}
#cfg{background:none;border:0;color:var(--mut);font-size:16px;padding:0 4px}
#cover{display:none;position:fixed;inset:0;background:#fff;color:#222;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;font:15px/1.5 Arial,sans-serif;z-index:20;overflow:auto}
#cover h2{font-size:18px;margin:0 0 10px}
#panel{display:none;padding:8px;border-bottom:1px solid var(--line);background:var(--hd)}
#panel label{display:block;margin:4px 0;color:var(--mut)}
#panel button{margin:4px 6px 0 0;padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:6px}
</style>
</head>
<body>
<div id="top"><span id="ttl">Sheet1</span><span><span id="meta"></span> <button id="cfg">⋮</button></span></div>
<div id="panel">
  <button id="theme">Toggle dark / light</button>
  <button id="reconnect">Reconnect</button>
  <label>Double-tap the title (or the cover page) to hide / show the sheet.</label>
</div>
<div id="msg"></div>
<table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>

<div id="cover">
  <h2>Weekly sync – notes</h2>
  <ul>
    <li>Review action items from last week</li>
    <li>Budget forecast – confirm Q4 figures</li>
    <li>Follow up on vendor contract</li>
    <li>Schedule next check-in</li>
  </ul>
</div>

<script>
const $=id=>document.getElementById(id);
const st={}; // merged feed state by topic
let status='connecting', retry=null, lastMsg=0, running=true;
const Cap=window.Capacitor, native=Cap&&Cap.isNativePlatform&&Cap.isNativePlatform();

// settings
let dark=false;
try{dark=localStorage.getItem('dark')==='1'}catch(e){}
function applyTheme(){document.body.classList.toggle('dark',dark)}
applyTheme();

// double-tap helper
function dbl(el,fn){let t=0;el.addEventListener('click',()=>{const n=Date.now();if(n-t<350){fn();t=0}else t=n})}
dbl($('ttl'),()=>{$('cover').style.display='block'});
dbl($('cover'),()=>{$('cover').style.display='none'});
$('cfg').onclick=()=>{const p=$('panel');p.style.display=p.style.display==='block'?'none':'block'};
$('theme').onclick=()=>{dark=!dark;try{localStorage.setItem('dark',dark?'1':'0')}catch(e){}applyTheme()};
$('reconnect').onclick=()=>connect();

// merge deltas
function merge(t,d){
  for(const k in d){
    const v=d[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)){
      if(!t[k]||typeof t[k]!=='object')t[k]={};
      merge(t[k],v);
    }else if(Array.isArray(v)){
      if(!Array.isArray(t[k]))t[k]=[];
      v.forEach((x,i)=>{if(x&&typeof x==='object'&&!Array.isArray(x)){if(!t[k][i]||typeof t[k][i]!=='object')t[k][i]={};merge(t[k][i],x)}else t[k][i]=x});
    }else t[k]=v;
  }
}
function onFeed(topic,data){
  if(!st[topic])st[topic]={};
  if(data&&typeof data==='object')merge(st[topic],data);else st[topic]=data;
}
function onRaw(text){
  lastMsg=Date.now();
  let j;try{j=JSON.parse(text)}catch(e){return}
  if(j.R&&typeof j.R==='object'){for(const k in j.R){const v=j.R[k];if(k.endsWith('.z'))continue;st[k]=JSON.parse(JSON.stringify(v))}}
  if(Array.isArray(j.M))j.M.forEach(m=>{if(m.M==='feed'&&m.A&&m.A.length>=2)onFeed(m.A[0],m.A[1])});
  render();
}

// connection
async function connect(){
  clearTimeout(retry);
  if(!native){status='needs the Android app';render();return}
  status='connecting';render();
  try{await F1.connect()}catch(e){status='failed: '+e.message;render();schedule()}
}
function schedule(){clearTimeout(retry);if(running)retry=setTimeout(connect,8000)}
let F1;
if(native){
  F1=Cap.registerPlugin('F1Feed');
  F1.addListener('msg',e=>onRaw(e.d));
  F1.addListener('status',e=>{status=e.s;render();if(e.s!=='open')schedule()});
}

// helpers
const sec=s=>{if(!s)return null;const p=String(s).split(':');return p.length===2?(+p[0])*60+(+p[1]):+p[0]};
const TRACK={'1':'','2':'YEL','3':'','4':'SC','5':'RED','6':'VSC','7':'VSC end'};
const val=x=>x==null?'':(typeof x==='object'?(x.Value??''):x);

function render(){
  const si=st.SessionInfo||{};
  const name=(si.Name||si.Type||'').toString();
  const quali=/qualif|shootout/i.test(name+' '+(si.Type||''));
  const race=/race|sprint$/i.test(name)&&!quali;
  const lc=st.LapCount||{};
  const ts=st.TrackStatus||{};
  const flag=TRACK[ts.Status]||'';
  $('meta').textContent=(flag?flag+' · ':'')+(race&&lc.CurrentLap?'L'+lc.CurrentLap+(lc.TotalLaps?'/'+lc.TotalLaps:''):'')+' '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const rc=st.RaceControlMessages&&st.RaceControlMessages.Messages;
  let last='';if(rc){const a=Array.isArray(rc)?rc:Object.values(rc);if(a.length)last=a[a.length-1].Message||''}
  $('msg').textContent=(status==='open'?'':'['+status+'] ')+(name?name+' – ':'')+last;
  $('head').innerHTML=quali
    ?'<th>P</th><th>Drv</th><th>Best</th><th>Gap</th><th>Last</th><th>Tyre</th><th>Laps</th>'
    :'<th>P</th><th>Drv</th><th>Gap</th><th>Int</th><th>Last</th><th>Best</th><th>Tyre</th><th>Pit</th>';
  const lines=(st.TimingData&&st.TimingData.Lines)||{};
  const dl=st.DriverList||{};
  const app=(st.TimingAppData&&st.TimingAppData.Lines)||{};
  const rows=Object.keys(lines).map(n=>({n,l:lines[n]})).filter(r=>r.l);
  rows.sort((a,b)=>(+a.l.Position||99)-(+b.l.Position||99));
  const bests=rows.map(r=>sec(val(r.l.BestLapTime))).filter(x=>x);
  const overall=bests.length?Math.min(...bests):null;
  const lead=rows.length?sec(val(rows[0].l.BestLapTime)):null;
  $('body').innerHTML=rows.map((r,i)=>{
    const l=r.l,d=dl[r.n]||{},a=app[r.n]||{};
    const stints=Array.isArray(a.Stints)?a.Stints:Object.values(a.Stints||{});
    const cur=stints[stints.length-1];
    const tyre=cur?((cur.Compound||'?')[0]+(cur.TotalLaps!=null?' '+cur.TotalLaps:'')):'';
    const bestS=sec(val(l.BestLapTime));
    const bestCls=bestS&&overall&&Math.abs(bestS-overall)<1e-6?' class="best"':'';
    const code=d.Tla||r.n;
    const pos=l.Position||i+1;
    if(quali){
      const gap=i&&bestS&&lead?'+'+(bestS-lead).toFixed(3):'';
      return `<tr><td>${pos}</td><td class="drv">${code}</td><td${bestCls}>${val(l.BestLapTime)}</td><td>${gap}</td><td>${val(l.LastLapTime)}</td><td>${tyre}</td><td>${l.NumberOfLaps||''}</td></tr>`;
    }
    const gap=i?(val(l.GapToLeader)||''):'Leader';
    const itv=l.InPit?'PIT':val(l.IntervalToPositionAhead);
    return `<tr><td>${pos}</td><td class="drv">${code}</td><td>${gap}</td><td>${itv}</td><td>${val(l.LastLapTime)}</td><td${bestCls}>${val(l.BestLapTime)}</td><td>${tyre}</td><td>${Math.max(0,stints.length-1)}</td></tr>`;
  }).join('');
}

// watchdog: reconnect if the feed goes quiet while "open"
setInterval(()=>{if(native&&status==='open'&&lastMsg&&Date.now()-lastMsg>45000){status='stale';render();connect()}},10000);
render();connect();
</script>
</body>
</html>
